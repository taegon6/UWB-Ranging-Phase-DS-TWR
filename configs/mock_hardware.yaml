schema_version: 1
config_kind: hardware_experiment
backend: mock

boards:
  A1:
    role: ANCHOR
    jlink_serial: MOCK-JLINK-A1
    serial_port: MOCK_A1
    firmware_target: anchor_a1
  A2:
    role: ANCHOR
    jlink_serial: MOCK-JLINK-A2
    serial_port: MOCK_A2
    firmware_target: anchor_a2
  T1:
    role: TAG
    jlink_serial: MOCK-JLINK-T1
    serial_port: MOCK_T1
    firmware_target: tag_t1
  T2:
    role: TAG
    jlink_serial: MOCK-JLINK-T2
    serial_port: MOCK_T2
    firmware_target: tag_t2

logic_analyzer:
  device_id: MOCK-LOGIC-001
  # Synthetic fixture setting only; it is not a verified analyzer sample rate.
  sample_rate_hz: 24000000
  capture_duration_s: 1.0
  channels:
    IRQ_PIN: 0
    ISR_ACTIVE: 1
    # Synthetic aggregate alias for the selected SPI profile; shares index 2.
    SPI_ACTIVE: 2
    SPI_STATUS: 2
    SPI_FRAME: 3
    UART_ENQUEUE: 4
    UART_TX: 5
    CIR_READ: 6
    PHASE_PROCESS: 7

serial:
  # Synthetic fixture setting only; firmware UART baud remains HW/code TODO.
  baud_rate: 115200
  timeout_s: 0.1

mock:
  random_seed: 20260710
  synthetic_only_values:
    logic_sample_rate_hz:
      value: 24000000
      status: SYNTHETIC_FIXTURE_ONLY
      hardware_verified: false
    uart_baud_rate:
      value: 115200
      status: SYNTHETIC_FIXTURE_ONLY
      hardware_verified: false
  timing_profile:
    irq_latency_us: 7.2
    isr_duration_us: 18.0
    spi_status_duration_us: 6.0
    spi_frame_duration_us: 38.0
    cir_read_duration_us: 405.0
    phase_processing_duration_us: 52.0
    uart_enqueue_duration_us: 5.0
    uart_physical_tx_duration_us: 310.0
    frame_period_us: 10000.0
  faults:
    flash_failure_probability: 0.0
    flash_fail_nodes: []
    missing_com_nodes: []
    missing_com_ports: []
    uart_corruption_probability: 0.01
    uart_buffer_overflow: false
    uart_overflow_probability: 0.0
    missing_logic_device: false
    missing_logic_channels: []
    missing_logic_capture_file: false
    pulse_jitter_us: 0.25
    irq_outlier_probability: 0.01
    irq_outlier_us: 25.0
    spi_duration_scale: 1.0
    cir_duration_scale: 1.0
    increased_spi_duration_us: 0.0
    increased_cir_duration_us: 0.0
    packet_timeout_probability: 0.01
    retry_probability: 0.02
    missing_link_probability: 0.02

experiments:
  timing_characterization:
    experiment_id: timing_characterization
    protocol_mode: INDEPENDENT
    ranging_mode: DS_ONLY
    operation_mode: APPROACH
    repetitions: 1000
    warmup_frames: 50
    capture_duration_s: 60
    metrics:
      - irq_latency
      - isr_duration
      - spi_status_duration
      - spi_frame_duration
      - cir_read_duration
      - phase_processing_duration
      - uart_enqueue_duration
      - uart_physical_tx_duration
      - frame_period
  connection_smoke_test:
    experiment_id: connection_smoke_test
    protocol_mode: INDEPENDENT
    ranging_mode: DS_ONLY
    operation_mode: APPROACH
    repetitions: 8
    warmup_frames: 0
    capture_duration_s: 2
    metrics:
      - frame_period

build:
  repository: .
  stop_on_failure: true
  reset_order: [A1, A2, T1, T2]
  targets:
    A1: anchor_a1
    A2: anchor_a2
    T1: tag_t1
    T2: tag_t2

outputs:
  results_root: results
  source_type: SYNTHETIC
  hardware_verified: false
